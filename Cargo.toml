[workspace]
resolver = "2"
members = [
    "poc-01-c-abi-bindgen",
    "poc-02-cxx-bridge",
    "poc-03-tauri-embed/src-tauri",
    "poc-04-ipc-stdio/engine-stub",
    "poc-04-ipc-stdio/client",
    "poc-04-ipc-stdio/shared",
]

[workspace.package]
edition = "2021"
license = "LicenseRef-Proprietary-Chevillat"
publish = false
authors = ["Patrice Chevillat"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
cc = "1"
cxx = "1"
cxx-build = "1"
raw-window-handle = "0.6"
